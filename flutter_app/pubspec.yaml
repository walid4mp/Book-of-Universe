name: kawn_library
description: Kawn Library multilingual reading and publishing app.
publish_to: 'none'
version: 0.2.0+2
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  supabase_flutter: 2.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  flutter_launcher_icons: 0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: '#091329'
  adaptive_icon_foreground: assets/app_icon.png
