name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Generate Android and iOS platform scaffolding
        working-directory: flutter_app
        run: flutter create --platforms=android,ios --org com.kawn.library .

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate app launcher icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Run Flutter Tests
        working-directory: flutter_app
        run: flutter test

      - name: Build Android APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kawn-Library-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
