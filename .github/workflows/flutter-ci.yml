name: Flutter CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate Android and iOS platform scaffolding
        working-directory: flutter_app
        run: flutter create --platforms=android,ios --org com.kawn.library .
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Generate app launcher icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Test
        working-directory: flutter_app
        run: flutter test
      - name: Build Android APK (configuration placeholder)
        working-directory: flutter_app
        run: flutter build apk --release
